version: '2'

issues:
  max-same-issues: 50

formatters:
  enable:
    - goimports
    - golines
    - gofmt
  settings:
    goimports:
      local-prefixes:
        - atmosoar.io/atmosoar-api-libraries
    golines:
      max-len: 120

linters:
  enable:
    # Essential reliability linters
    - bodyclose
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - govet
    - noctx
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - unused

    # Code quality
    - asasalint
    - bidichk
    - copyloopvar
    - dupl
    - gochecknoinits
    - gocognit
    - goconst
    - ineffassign
    - loggercheck
    - makezero
    - musttag
    - nestif
    - nilerr
    - nilnil
    - nolintlint
    - predeclared
    - sqlclosecheck
    - tparallel
    - unparam
    - wastedassign
    - whitespace

  settings:
    # gocognit/nestif/dupl thresholds and nolintlint strictness follow the
    # Atmosoar baseline (atmosoar-ci lint/golangci.yml).
    dupl:
      threshold: 150
    gocognit:
      min-complexity: 40
    nestif:
      min-complexity: 6
    nolintlint:
      require-explanation: true
      require-specific: true
    errcheck:
      check-type-assertions: true
    exhaustive:
      check:
        - switch
        - mapliteral
    gocritic:
      settings:
        captLocal:
          paramsOnly: false
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1016
        - -QF1008

  exclusions:
    warn-unused: true
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      - path: '_test\.go'
        linters:
          - bodyclose
          - dupl
          - errcheck
          - gocognit
          - goconst
          - gosec
          - noctx
          - unparam
      # Parameter registry and palette tables repeat each key as map key, Key
      # field and alias target by design; goconst (v2.15+) counts those.
      - path: 'chart/(parameters|palette)\.go'
        linters:
          - goconst
