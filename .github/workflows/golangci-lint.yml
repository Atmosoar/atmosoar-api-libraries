name: golangci-lint
on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Single source of truth for the Go version: go.mod.
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Must be a release built with a Go toolchain >= the `go` directive
          # in go.mod (1.25.9) — v2.1.x was built with Go 1.24 and refuses to
          # load the config ("Go language version ... lower than targeted").
          version: v2.11
