name: golangci-lint
on:
  # Feature work merges into develop through PRs, so CI has to run there too,
  # not only when develop is promoted to master. enforce_policy.sh keeps the
  # hard vulnerability gate for master and a soft note on other branches.
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "master", "develop" ]

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Single source of truth for the Go version: go.mod.
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Must be a release built with a Go toolchain >= the `go` directive
          # in go.mod (1.27.4) — v2.11 was built with Go 1.26 and refuses to
          # load the config ("Go language version ... lower than targeted").
          version: v2.15.0
